<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Animeghaa Production House</title>
  <style>
    @font-face {
      font-family: 'The Bold Font';
      src: url('fonts/THEBOLDFONT-FREEVERSION.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Spartan MB Bold';
      src: url('fonts/SpartanMB-SemiBold.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow-x: hidden; }

    body {
      display: flex;
      position: relative;
      font-family: 'Spartan MB Bold', 'Helvetica Neue', Arial, sans-serif;
      background: #0d0d0d;
      -webkit-tap-highlight-color: transparent;
      overflow-y: auto;
    }

    /* PANELS */
    .panel {
      width: 50%;
      height: 100vh;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      cursor: pointer;
      overflow: hidden;
      transition: filter 0.45s ease, flex-basis 0.5s ease;
    }

    body.hover-anim   .panel-design { filter: brightness(0.45) saturate(0.7); }
    body.hover-design .panel-anim   { filter: brightness(0.45) saturate(0.7); }

    .panel-anim {
      background: linear-gradient(160deg, #1c0f4a 0%, #3b1f8a 45%, #6a40c9 100%);
    }
    .panel-design {
      background: linear-gradient(160deg, #6a3a00 0%, #b87208 45%, #f0aa28 100%);
    }

    /* GRAIN / NOISE OVERLAY for editorial feel */
    .panel::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(rgba(255,255,255,0.04) 1px, transparent 1px);
      background-size: 3px 3px;
      mix-blend-mode: overlay;
      pointer-events: none;
    }

    /* NUMBERED TAG (KBD-style 01. / 02.) */
    .panel-tag {
      position: absolute;
      top: 32px;
      left: 36px;
      font-family: 'Spartan MB Bold', 'Helvetica Neue', Arial, sans-serif;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.22em;
      color: rgba(255,255,255,0.55);
      text-transform: uppercase;
      z-index: 6;
    }

    .panel-design .panel-tag { right: 36px; left: auto; }

    /* MASSIVE STACKED HEADLINE */
    .panel-content {
      position: relative;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      padding: 0 60px;
      width: 100%;
      max-width: 620px;
    }

    .panel-design .panel-content {
      align-items: flex-end;
      text-align: right;
    }

    .stack {
      font-family: 'The Bold Font', 'Spartan MB Bold', Impact, sans-serif;
      font-weight: 400;
      color: #fff;
      text-transform: uppercase;
      line-height: 0.88;
      letter-spacing: -0.01em;
      user-select: none;
    }

    .stack span {
      display: block;
      font-size: clamp(64px, 9vw, 132px);
    }

    .stack span.muted {
      color: rgba(255,255,255,0.32);
      -webkit-text-stroke: 1px rgba(255,255,255,0.55);
      color: transparent;
    }

    /* CHEEKY TAGLINE */
    .panel-tagline {
      margin-top: 28px;
      font-family: 'Spartan MB Bold', 'Helvetica Neue', Arial, sans-serif;
      font-size: 0.95rem;
      font-weight: 400;
      line-height: 1.45;
      color: rgba(255,255,255,0.78);
      max-width: 340px;
    }

    .panel-design .panel-tagline { text-align: right; margin-left: auto; }

    /* EXPLORE BUTTON */
    .explore-btn {
      margin-top: 36px;
      padding: 14px 32px;
      border: 1.5px solid rgba(255,255,255,0.55);
      border-radius: 0;
      color: #fff;
      font-family: 'Spartan MB Bold', 'Helvetica Neue', Arial, sans-serif;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      background: transparent;
      pointer-events: none;
      white-space: nowrap;
      transition: background 0.25s, color 0.25s, border-color 0.25s, transform 0.25s;
      display: inline-flex;
      align-items: center;
      gap: 12px;
    }

    .explore-btn .arrow { font-size: 1rem; transition: transform 0.25s; }
    .panel:hover .explore-btn { background: #fff; color: #141414; border-color: #fff; }
    .panel:hover .explore-btn .arrow { transform: translateX(4px); }

    /* GLOW — radial burst from center, scrolls with the panels */
    .glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 620px;
      height: 620px;
      background: radial-gradient(
        circle,
        rgba(255,255,255,0.95)  0%,
        rgba(255,255,255,0.55) 14%,
        rgba(255,255,255,0.18) 38%,
        rgba(255,255,255,0.04) 60%,
        rgba(255,255,255,0)    78%
      );
      z-index: 10;
      pointer-events: none;
    }

    /* CENTER LOGO — scrolls with the panels instead of staying pinned to the viewport */
    .center-logo {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 20;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      object-fit: cover;
      pointer-events: none;
    }


    /* FOOTER */
    .hub-footer {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      padding: 18px 36px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 30;
      pointer-events: none;
    }
    .hub-footer span {
      font-family: 'Spartan MB Bold', 'Helvetica Neue', Arial, sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.16em;
      color: rgba(255,255,255,0.45);
      font-weight: 500;
      text-transform: uppercase;
    }

    .footer-logo-img {
      height: 16px;
      width: auto;
      display: block;
      filter: brightness(0) invert(1);
      opacity: 0.85;
    }

    @media (max-width: 900px) {
      .panel-content { padding: 0 36px; }
      .stack span { font-size: clamp(56px, 14vw, 96px); }
      .center-logo { width: 180px; height: 180px; }
      .glow { width: 380px; height: 380px; }
    }

    @media (max-width: 600px) {
      body { flex-direction: column; }
      .panel { width: 100%; height: 50vh; min-height: 50vh; height: 50svh; }
      .panel-content { padding: 0 24px; align-items: flex-start; text-align: left; }
      .panel-design .panel-content { align-items: flex-start; text-align: left; }
      .panel-anim .panel-content { padding-bottom: 46px; }
      .panel-design .panel-content { padding-top: 46px; }
      .stack span { font-size: clamp(38px, 11vw, 64px); }
      .panel-tagline { font-size: 0.85rem; max-width: 100%; margin-top: 14px; }
      .panel-design .panel-tagline { text-align: left; margin-left: 0; }
      .explore-btn { margin-top: 18px; padding: 11px 22px; font-size: 0.65rem; }
      .center-logo { width: 56px; height: 56px; }
      .glow { width: 130px; height: 130px; }
      .panel-tag { top: 18px; left: 22px; font-size: 0.65rem; }
      .panel-design .panel-tag { right: 22px; }
      .hub-footer { flex-direction: column; gap: 4px; text-align: center; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); }
      .footer-logo-img { margin: 0 auto; }
    }

    /* Very short viewports (landscape phones): let content scroll instead of clipping */
    @media (max-height: 480px) {
      .panel { height: auto; min-height: 100vh; }
      body.hover-anim .panel-design,
      body.hover-design .panel-anim { filter: none; }
    }

    /* Extra-narrow phones */
    @media (max-width: 360px) {
      .stack span { font-size: clamp(32px, 10vw, 56px); }
      .panel-tagline { font-size: 0.78rem; }
    }
  </style>
</head>
<body>

  <a href="animation-portfolio.html" class="panel panel-anim" id="panelAnim">
    <span class="panel-tag">01 / Motion</span>
    <div class="panel-content">
      <div class="stack">
        <span>Make</span>
        <span>It</span>
        <span class="muted">Move.</span>
      </div>
      <p class="panel-tagline">Animation that refuses to sit still. Frames with a pulse, stories with teeth.</p>
      <span class="explore-btn">Enter Animation <span class="arrow">&rarr;</span></span>
    </div>
  </a>

  <a href="portfolio.html" class="panel panel-design" id="panelDesign">
    <span class="panel-tag">02 / Visual</span>
    <div class="panel-content">
      <div class="stack">
        <span>Print</span>
        <span>That</span>
        <span class="muted">Stares.</span>
      </div>
      <p class="panel-tagline">Brand, packaging, editorial, illustration. Design that walks into the room and owns it.</p>
      <span class="explore-btn">Enter Visual Design <span class="arrow">&rarr;</span></span>
    </div>
  </a>

  <div class="glow"></div>
  <img class="center-logo" id="centerLogo" src="Logo/logo-icon.png" alt="APH Logo">

  <footer class="hub-footer">
    <img src="Logo/Logo.png" alt="Animeghaa Production House" class="footer-logo-img">
    <span>2026 &nbsp;/&nbsp; All Rights Reserved</span>
  </footer>

  <script>
    const body = document.body;
    const anim   = document.getElementById('panelAnim');
    const design = document.getElementById('panelDesign');
    anim.addEventListener('mouseenter',   () => body.classList.add('hover-anim'));
    anim.addEventListener('mouseleave',   () => body.classList.remove('hover-anim'));
    design.addEventListener('mouseenter', () => body.classList.add('hover-design'));
    design.addEventListener('mouseleave', () => body.classList.remove('hover-design'));

    /* ----- CENTER LOGO ROTATES TO FOLLOW CURSOR ----- */
    const logo = document.getElementById('centerLogo');
    let targetAngle  = 0;
    let currentAngle = 0;

    window.addEventListener('mousemove', (e) => {
      const cx = window.innerWidth  / 2;
      const cy = window.innerHeight / 2;
      // angle from logo centre (screen centre) to cursor, in degrees
      targetAngle = Math.atan2(e.clientY - cy, e.clientX - cx) * 180 / Math.PI;
    });

    function tickLogo() {
      // shortest-path lerp toward the target angle
      let diff = targetAngle - currentAngle;
      while (diff >  180) diff -= 360;
      while (diff < -180) diff += 360;
      currentAngle += diff * 0.12;
      logo.style.transform = `translate(-50%, -50%) rotate(${currentAngle}deg)`;
      requestAnimationFrame(tickLogo);
    }
    tickLogo();
  </script>

  <!-- SMOOTH SCROLL (Lenis) — harmless on this fullscreen page, kept for consistency -->
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.20/dist/lenis.min.js"></script>
  <script>
    if (typeof Lenis !== 'undefined') {
      const lenis = new Lenis({
        duration: 1.25,
        easing: t => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
        smoothWheel: true
      });
      function lenisRaf(time) { lenis.raf(time); requestAnimationFrame(lenisRaf); }
      requestAnimationFrame(lenisRaf);
    }
  </script>
</body>
</html>
